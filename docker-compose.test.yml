# ============================================================
# HorizonR — Base de données dédiée aux tests d'intégration
# Port 3307 (ne pas confondre avec le 3306 du dev)
# ============================================================
services:
  mysql_test:
    image: mysql:8.0
    container_name: horizonr_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: roottest
      MYSQL_DATABASE: horizonr_db
      MYSQL_USER: horizonr_user
      MYSQL_PASSWORD: horizonr_password
    ports:
      - "3308:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proottest",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
